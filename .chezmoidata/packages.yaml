    - git
    - curl
    - wget
    - unzip
    - zsh
    - tmux
    - jq
    - tree
    - luarocks
    - git-lfs
    - shellcheck

  linux:
    apt:
      - build-essential
      - cmake
      - python3
      - python3-pip
      - python3-venv
      - xclip
      - wl-clipboard
      - gnome-screenshot
      - xdotool
